<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<title>Ball Brawl</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;color:#fff;font-family:-apple-system,Roboto,sans-serif;position:fixed;overscroll-behavior:none}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;background:radial-gradient(circle at 50% 20%,#1a1a2e 0%,#0a0a0f 70%);z-index:10;overflow-y:auto}
.title{font-size:36px;font-weight:900;letter-spacing:2px;margin-bottom:16px;text-align:center;line-height:1}
.title span{color:#ff3366;text-shadow:0 0 20px rgba(255,51,102,.6)}
.lbl{width:100%;max-width:340px;font-size:12px;color:#888;margin:10px 0 6px;text-transform:uppercase;letter-spacing:1px}
.inp{width:100%;max-width:340px;padding:12px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);border-radius:12px;color:#fff;font-size:16px;outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:#ff3366}
.inp.code{text-transform:uppercase;letter-spacing:4px;text-align:center;font-weight:bold}
.row{display:flex;gap:8px;max-width:340px;width:100%;align-items:center}
.colors{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:340px;margin-top:4px}
.swatch{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .15s}
.swatch.active{border-color:#fff;transform:scale(1.15)}
.btn{width:100%;max-width:340px;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .1s;margin-top:12px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#ff3366,#ff6633);color:#fff;box-shadow:0 4px 20px rgba(255,51,102,.4)}
.btn.green{background:linear-gradient(135deg,#34c759,#28a745);color:#fff;box-shadow:0 4px 20px rgba(52,199,89,.4)}
.btn.gray{background:rgba(255,255,255,.12);color:#fff}
.btn.danger{background:rgba(255,60,60,.25);color:#ff6666}
.err{color:#ff5566;margin-top:10px;font-size:14px;min-height:18px;text-align:center}
.roomcode{font-size:36px;font-weight:900;letter-spacing:8px;color:#ff3366;margin:8px 0}
.hint{color:#888;font-size:13px;text-align:center;margin:4px 0}
.players-box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px;margin:14px 0}
.pl-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.06);border-radius:10px;font-size:14px}
.pl-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.pl-team{font-size:11px;padding:2px 8px;border-radius:6px;margin-left:auto}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.hud-top{position:absolute;top:0;left:0;right:0;padding:10px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.scorebox{background:rgba(0,0,0,.65);padding:8px 14px;border-radius:12px;font-weight:700;font-size:18px;display:flex;gap:8px;align-items:center}
.scorebox .red{color:#ff3366}
.scorebox .blue{color:#33aaff}
.pingbox{background:rgba(0,0,0,.6);padding:6px 10px;border-radius:10px;font-size:11px;opacity:.8}
.exit{pointer-events:auto;width:40px;height:40px;border-radius:50%;background:rgba(255,60,60,.3);border:1px solid rgba(255,60,60,.6);color:#ff6666;font-size:18px;font-weight:700;flex-shrink:0}

#goalMsg{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);font-size:56px;font-weight:900;color:#ffcc00;text-shadow:0 0 40px rgba(255,204,0,.9);opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;z-index:7}
#goalMsg.show{opacity:1}

#countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;font-weight:900;color:#ff3366;text-shadow:0 0 60px rgba(255,51,102,.9);z-index:8;pointer-events:none}
#countdown.show{display:flex}

/* JOYSTICK (left) */
#joyZone{position:absolute;left:0;bottom:0;width:50%;height:60%;z-index:6;touch-action:none}
.joy-base{position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);pointer-events:none;display:none;transform:translate(-50%,-50%)}
.joy-stick{position:absolute;width:65px;height:65px;border-radius:50%;background:rgba(255,51,102,.75);border:2px solid #fff;pointer-events:none;display:none;transform:translate(-50%,-50%);box-shadow:0 0 20px rgba(255,51,102,.6)}

/* ACTION BUTTONS (right) */
#actionZone{position:absolute;right:0;bottom:0;width:50%;height:60%;z-index:6;touch-action:none;pointer-events:none}
.act-btn{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(255,255,255,.4);color:#fff;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;transition:transform .08s, background .08s}
.act-btn:active,.act-btn.on{transform:scale(.9)}
.act-btn .lbl2{font-size:11px;opacity:.85;font-weight:600;margin-top:2px}
#btnKick{width:80px;height:80px;right:24px;bottom:24px;background:rgba(255,51,102,.55);font-size:24px}
#btnPass{width:64px;height:64px;right:120px;bottom:36px;background:rgba(51,170,255,.55);font-size:18px}
#btnDash{width:64px;height:64px;right:36px;bottom:120px;background:rgba(255,204,0,.55);color:#222;font-size:18px}
#btnKick.on{background:rgba(255,51,102,.95)}
#btnPass.on{background:rgba(51,170,255,.95)}
#btnDash.on{background:rgba(255,204,0,.95)}
.act-btn.cd{opacity:.35}

/* RESULT */
#result{position:absolute;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
#result.show{display:flex}
.result-box{background:rgba(20,20,30,.98);border-radius:20px;padding:28px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;border:2px solid rgba(255,255,255,.1)}
.result-box h2{font-size:28px}
.result-score{font-size:42px;font-weight:900;margin:10px 0}

/* TEAM SELECT TOGGLE */
.team-info{font-size:12px;color:#888;text-align:center;margin-top:6px}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="scorebox"><span class="red" id="redScore">0</span> : <span class="blue" id="blueScore">0</span></div>
    <div class="pingbox" id="pingBox">-- ms</div>
    <button class="exit" id="exitBtn">✕</button>
  </div>
</div>

<div id="goalMsg"></div>
<div id="countdown"></div>

<!-- Controls -->
<div id="joyZone">
  <div class="joy-base" id="joyBase"></div>
  <div class="joy-stick" id="joyStick"></div>
</div>

<div id="actionZone">
  <button class="act-btn" id="btnKick">⚽<span class="lbl2">Удар</span></button>
  <button class="act-btn" id="btnPass">➤<span class="lbl2">Пас</span></button>
  <button class="act-btn" id="btnDash">⚡<span class="lbl2">Рывок</span></button>
</div>

<!-- RESULT OVERLAY -->
<div id="result">
  <div class="result-box">
    <h2 id="resultTitle">Победа!</h2>
    <div class="result-score"><span class="red" id="resRed">0</span> : <span class="blue" id="resBlue">0</span></div>
    <button class="btn primary" id="btnRematch">Реванш</button>
    <button class="btn danger" id="btnToMenu">В меню</button>
  </div>
</div>

<!-- MENU -->
<div id="menu" class="screen">
  <div class="title">⚽ BALL<br><span>BRAWL</span></div>
  <div class="lbl">Ник</div>
  <input id="nick" class="inp" maxlength="14" value="Игрок1">
  <div class="lbl">Цвет</div>
  <div id="colors" class="colors"></div>
  <div class="lbl">Номер на круге (0–99)</div>
  <input id="numberInput" class="inp" type="number" min="0" max="99" value="7">
  
  <button id="btnCreate" class="btn primary">Создать комнату</button>
  
  <div class="lbl">Код комнаты</div>
  <input id="code" class="inp code" maxlength="5" placeholder="XXXXX" autocapitalize="characters">
  <button id="btnJoin" class="btn green">Подключиться</button>
  
  <button id="btnTraining" class="btn gray">🎯 Тренировка (соло)</button>
  
  <div id="err" class="err"></div>
</div>

<!-- LOBBY -->
<div id="lobby" class="screen hidden">
  <div class="title" style="font-size:24px">Лобби</div>
  <div class="hint">Код комнаты:</div>
  <div class="roomcode" id="roomCodeLbl">-----</div>
  <div class="hint">Игроков: <b id="plCount">1</b>/4 • Команда: <b id="myTeam">-</b></div>
  <div class="players-box" id="plBox"></div>
  <button id="btnStart" class="btn primary">Начать матч</button>
  <div class="hint" id="hostHint"></div>
  <button id="btnLeave" class="btn danger">Выйти</button>
</div>

<script src="/socket.io/socket.io.js"></script>
