<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<title>Ball Brawl</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;color:#fff;font-family:-apple-system,Roboto,sans-serif;position:fixed;overscroll-behavior:none}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;background:radial-gradient(circle at 50% 20%,#1a1a2e 0%,#0a0a0f 70%);z-index:10;overflow-y:auto}
.title{font-size:36px;font-weight:900;letter-spacing:2px;margin-bottom:16px;text-align:center;line-height:1}
.title span{color:#ff3366;text-shadow:0 0 20px rgba(255,51,102,.6)}
.lbl{width:100%;max-width:340px;font-size:12px;color:#888;margin:10px 0 6px;text-transform:uppercase;letter-spacing:1px}
.inp{width:100%;max-width:340px;padding:12px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);border-radius:12px;color:#fff;font-size:16px;outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:#ff3366}
.inp.code{text-transform:uppercase;letter-spacing:4px;text-align:center;font-weight:bold}
.row{display:flex;gap:8px;max-width:340px;width:100%;align-items:center}
.colors{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:340px;margin-top:4px}
.swatch{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .15s}
.swatch.active{border-color:#fff;transform:scale(1.15)}
.btn{width:100%;max-width:340px;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .1s;margin-top:12px}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#ff3366,#ff6633);color:#fff;box-shadow:0 4px 20px rgba(255,51,102,.4)}
.btn.green{background:linear-gradient(135deg,#34c759,#28a745);color:#fff;box-shadow:0 4px 20px rgba(52,199,89,.4)}
.btn.gray{background:rgba(255,255,255,.12);color:#fff}
.btn.danger{background:rgba(255,60,60,.25);color:#ff6666}
.err{color:#ff5566;margin-top:10px;font-size:14px;min-height:18px;text-align:center}
.roomcode{font-size:36px;font-weight:900;letter-spacing:8px;color:#ff3366;margin:8px 0}
.hint{color:#888;font-size:13px;text-align:center;margin:4px 0}
.players-box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px;margin:14px 0}
.pl-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.06);border-radius:10px;font-size:14px}
.pl-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.pl-team{font-size:11px;padding:2px 8px;border-radius:6px;margin-left:auto}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.hud-top{position:absolute;top:0;left:0;right:0;padding:10px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.scorebox{background:rgba(0,0,0,.65);padding:8px 14px;border-radius:12px;font-weight:700;font-size:18px;display:flex;gap:8px;align-items:center}
.scorebox .red{color:#ff3366}
.scorebox .blue{color:#33aaff}
.pingbox{background:rgba(0,0,0,.6);padding:6px 10px;border-radius:10px;font-size:11px;opacity:.8}
.exit{pointer-events:auto;width:40px;height:40px;border-radius:50%;background:rgba(255,60,60,.3);border:1px solid rgba(255,60,60,.6);color:#ff6666;font-size:18px;font-weight:700;flex-shrink:0}

#goalMsg{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);font-size:56px;font-weight:900;color:#ffcc00;text-shadow:0 0 40px rgba(255,204,0,.9);opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;z-index:7}
#goalMsg.show{opacity:1}

#countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;font-weight:900;color:#ff3366;text-shadow:0 0 60px rgba(255,51,102,.9);z-index:8;pointer-events:none}
#countdown.show{display:flex}

/* JOYSTICK (left) */
#joyZone{position:absolute;left:0;bottom:0;width:50%;height:60%;z-index:6;touch-action:none}
.joy-base{position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);pointer-events:none;display:none;transform:translate(-50%,-50%)}
.joy-stick{position:absolute;width:65px;height:65px;border-radius:50%;background:rgba(255,51,102,.75);border:2px solid #fff;pointer-events:none;display:none;transform:translate(-50%,-50%);box-shadow:0 0 20px rgba(255,51,102,.6)}

/* ACTION BUTTONS (right) */
#actionZone{position:absolute;right:0;bottom:0;width:50%;height:60%;z-index:6;touch-action:none;pointer-events:none}
.act-btn{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(255,255,255,.4);color:#fff;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;transition:transform .08s, background .08s}
.act-btn:active,.act-btn.on{transform:scale(.9)}
.act-btn .lbl2{font-size:11px;opacity:.85;font-weight:600;margin-top:2px}
#btnKick{width:80px;height:80px;right:24px;bottom:24px;background:rgba(255,51,102,.55);font-size:24px}
#btnPass{width:64px;height:64px;right:120px;bottom:36px;background:rgba(51,170,255,.55);font-size:18px}
#btnDash{width:64px;height:64px;right:36px;bottom:120px;background:rgba(255,204,0,.55);color:#222;font-size:18px}
#btnKick.on{background:rgba(255,51,102,.95)}
#btnPass.on{background:rgba(51,170,255,.95)}
#btnDash.on{background:rgba(255,204,0,.95)}
.act-btn.cd{opacity:.35}

/* RESULT */
#result{position:absolute;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
#result.show{display:flex}
.result-box{background:rgba(20,20,30,.98);border-radius:20px;padding:28px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;border:2px solid rgba(255,255,255,.1)}
.result-box h2{font-size:28px}
.result-score{font-size:42px;font-weight:900;margin:10px 0}

/* TEAM SELECT TOGGLE */
.team-info{font-size:12px;color:#888;text-align:center;margin-top:6px}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="scorebox"><span class="red" id="redScore">0</span> : <span class="blue" id="blueScore">0</span></div>
    <div class="pingbox" id="pingBox">-- ms</div>
    <button class="exit" id="exitBtn">✕</button>
  </div>
</div>

<div id="goalMsg"></div>
<div id="countdown"></div>

<!-- Controls -->
<div id="joyZone">
  <div class="joy-base" id="joyBase"></div>
  <div class="joy-stick" id="joyStick"></div>
</div>

<div id="actionZone">
  <button class="act-btn" id="btnKick">⚽<span class="lbl2">Удар</span></button>
  <button class="act-btn" id="btnPass">➤<span class="lbl2">Пас</span></button>
  <button class="act-btn" id="btnDash">⚡<span class="lbl2">Рывок</span></button>
</div>

<!-- RESULT OVERLAY -->
<div id="result">
  <div class="result-box">
    <h2 id="resultTitle">Победа!</h2>
    <div class="result-score"><span class="red" id="resRed">0</span> : <span class="blue" id="resBlue">0</span></div>
    <button class="btn primary" id="btnRematch">Реванш</button>
    <button class="btn danger" id="btnToMenu">В меню</button>
  </div>
</div>

<!-- MENU -->
<div id="menu" class="screen">
  <div class="title">⚽ BALL<br><span>BRAWL</span></div>
  <div class="lbl">Ник</div>
  <input id="nick" class="inp" maxlength="14" value="Игрок1">
  <div class="lbl">Цвет</div>
  <div id="colors" class="colors"></div>
  <div class="lbl">Номер на круге (0–99)</div>
  <input id="numberInput" class="inp" type="number" min="0" max="99" value="7">
  
  <button id="btnCreate" class="btn primary">Создать комнату</button>
  
  <div class="lbl">Код комнаты</div>
  <input id="code" class="inp code" maxlength="5" placeholder="XXXXX" autocapitalize="characters">
  <button id="btnJoin" class="btn green">Подключиться</button>
  
  <button id="btnTraining" class="btn gray">🎯 Тренировка (соло)</button>
  
  <div id="err" class="err"></div>
</div>

<!-- LOBBY -->
<div id="lobby" class="screen hidden">
  <div class="title" style="font-size:24px">Лобби</div>
  <div class="hint">Код комнаты:</div>
  <div class="roomcode" id="roomCodeLbl">-----</div>
  <div class="hint">Игроков: <b id="plCount">1</b>/4 • Команда: <b id="myTeam">-</b></div>
  <div class="players-box" id="plBox"></div>
  <button id="btnStart" class="btn primary">Начать матч</button>
  <div class="hint" id="hostHint"></div>
  <button id="btnLeave" class="btn danger">Выйти</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
'use strict';

// ==================== CONSTANTS ====================
const ARENA_R = 520;
const PLAYER_R = 32;
const BALL_R = 22;
const MAX_GOALS = 5;
const TEAM_COLORS = { red: '#ff3366', blue: '#33aaff' };

// ==================== STATE ====================
const S = {
  socket: null,
  myId: null,
  roomCode: null,
  inGame: false,
  training: false,
  isHost: false,
  players: {},       // id -> { x, y, vx, vy, name, color, team, number, dashCd }
  ball: { x: 0, y: 0, vx: 0, vy: 0 },
  myInput: { x: 0, y: 0 },
  color: '#ff3366',
  nick: 'Игрок1',
  number: 7,
  scores: { red: 0, blue: 0 },
  cam: { x: 0, y: 0 },
  lastFrame: performance.now(),
  ping: 0,
  lastInputSent: 0
};

// ==================== CANVAS ====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = canvas.width = innerWidth * DPR;
  H = canvas.height = innerHeight * DPR;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

// ==================== UI ====================
const $ = id => document.getElementById(id);
const menu = $('menu'), lobby = $('lobby'), hud = $('hud');
const joyBase = $('joyBase'), joyStick = $('joyStick');
const joyZone = $('joyZone'), actionZone = $('actionZone');
const btnKick = $('btnKick'), btnPass = $('btnPass'), btnDash = $('btnDash');

function showError(msg) {
  $('err').textContent = msg;
  setTimeout(() => { $('err').textContent = ''; }, 4000);
}

// ==================== COLOR PICKER ====================
const COLORS = ['#ff3366','#33aaff','#ffcc00','#66ff66','#ff66cc','#ff8800','#aa66ff','#00ffcc'];
const colorsEl = $('colors');
COLORS.forEach((c, i) => {
  const d = document.createElement('div');
  d.className = 'swatch' + (i === 0 ? ' active' : '');
  d.style.background = c;
  d.addEventListener('click', () => {
    S.color = c;
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
    d.classList.add('active');
  });
  colorsEl.appendChild(d);
});

// ==================== SOCKET ====================
const socket = io();
S.socket = socket;

socket.on('connect', () => { S.myId = socket.id; });
socket.on('disconnect', () => { if (!S.training) showError('Соединение потеряно'); });

socket.on('lobbyUpdate', (d) => {
  S.players = {};
  d.players.forEach(p => {
    if (!S.players[p.id]) S.players[p.id] = {};
    Object.assign(S.players[p.id], p);
  });
  S.isHost = (d.host === S.myId);
  renderLobbyPlayers();
});

socket.on('playerJoined', (p) => {
  if (!S.players[p.id]) S.players[p.id] = {};
  Object.assign(S.players[p.id], p);
  renderLobbyPlayers();
});

socket.on('playerLeft', (id) => {
  delete S.players[id];
  renderLobbyPlayers();
});

socket.on('state', (snap) => {
  S.ball = snap.ball;
  for (const id in snap.players) {
    if (!S.players[id]) S.players[id] = {};
    const s = snap.players[id];
    // Target for interpolation
    S.players[id]._tx = s.x;
    S.players[id]._ty = s.y;
    S.players[id]._tvx = s.vx;
    S.players[id]._tvy = s.vy;
    S.players[id].dashCd = s.dashCd;
    if (S.players[id].x === undefined) {
      S.players[id].x = s.x;
      S.players[id].y = s.y;
    }
  }
  renderScoreboard();
});

socket.on('goal', (d) => {
  S.scores.red = d.red;
  S.scores.blue = d.blue;
  updateScoreUI();
  showGoal('ГОЛ! ' + (d.scorer || ''));
});

socket.on('matchEnd', (d) => {
  showResult(d.winner, d.red, d.blue);
});

socket.on('countdown', () => {
  startCountdown();
});

socket.on('gameStarted', (d) => {
  startGameClient(d.players);
});

// ==================== MENU BUTTONS ====================
$('btnCreate').addEventListener('click', () => {
  S.nick = $('nick').value.trim() || 'Игрок';
  S.number = parseInt($('numberInput').value) || 0;
  socket.emit('createRoom', { name: S.nick, color: S.color, number: S.number }, (res) => {
    if (!res.ok) return showError(res.error || 'Ошибка');
    S.roomCode = res.code;
    S.isHost = true;
    S.players = {};
    res.players.forEach(p => { S.players[p.id] = { ...p }; });
    enterLobby();
  });
});

$('btnJoin').addEventListener('click', () => {
  const code = $('code').value.trim().toUpperCase();
  const name = $('nick').value.trim() || 'Игрок';
  if (code.length !== 5) return showError('Код из 5 символов');
  S.nick = name;
  S.number = parseInt($('numberInput').value) || 0;
  socket.emit('joinRoom', { code, name, color: S.color, number: S.number }, (res) => {
    if (!res.ok) return showError(res.error || 'Ошибка');
    S.roomCode = res.code;
    S.isHost = (res.host === S.myId);
    S.players = {};
    res.players.forEach(p => { S.players[p.id] = { ...p }; });
    enterLobby();
  });
});

$('btnTraining').addEventListener('click', () => {
  S.training = true;
  S.nick = $('nick').value.trim() || 'Игрок';
  S.number = parseInt($('numberInput').value) || 0;
  startTrainingMode();
});

function enterLobby() {
  menu.classList.add('hidden');
  lobby.classList.remove('hidden');
  $('roomCodeLbl').textContent = S.roomCode;
  renderLobbyPlayers();
}

function renderLobbyPlayers() {
  const box = $('plBox');
  box.innerHTML = '';
  const list = Object.values(S.players);
  $('plCount').textContent = list.length;
  const myP = S.players[S.myId];
  $('myTeam').textContent = myP ? (myP.team === 'red' ? '🔴 Красные' : '🔵 Синие') : '-';

  list.forEach(p => {
    const d = document.createElement('div');
    d.className = 'pl-item';
    const teamLabel = p.team === 'red' ? '🔴' : '🔵';
    const teamBg = p.team === 'red' ? 'rgba(255,51,102,.3)' : 'rgba(51,170,255,.3)';
    d.innerHTML = `<div class="pl-dot" style="background:${p.color}"></div>
      <span>#${p.number} ${escapeHtml(p.name)}${p.id === S.myId ? ' (вы)' : ''}</span>
      <span class="pl-team" style="background:${teamBg}">${teamLabel}</span>`;
    box.appendChild(d);
  });

  if (S.isHost) {
    $('btnStart').style.display = 'block';
    $('hostHint').textContent = list.length >= 2 ? 'Нажми «Начать матч»' : 'Нужно минимум 2 игрока';
    $('btnStart').disabled = list.length < 2;
    $('btnStart').style.opacity = list.length < 2 ? '.5' : '1';
  } else {
    $('btnStart').style.display = 'none';
    $('hostHint').textContent = 'Ждём хоста...';
  }
}

$('btnStart').addEventListener('click', () => {
  socket.emit('startGame');
});
$('btnLeave').addEventListener('click', () => {
  socket.disconnect();
  setTimeout(() => location.reload(), 200);
});
$('exitBtn').addEventListener('click', () => {
  if (confirm('Выйти из матча?')) {
    socket.disconnect();
    setTimeout(() => location.reload(), 200);
  }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

// ==================== GAME START ====================
function startCountdown() {
  const el = $('countdown');
  el.classList.add('show');
  let n = 3;
  el.textContent = n;
  const iv = setInterval(() => {
    n--;
    if (n > 0) el.textContent = n;
    else if (n === 0) el.textContent = 'GO!';
    else { clearInterval(iv); el.classList.remove('show'); }
  }, 1000);
}

function startGameClient(players) {
  lobby.classList.add('hidden');
  menu.classList.add('hidden');
  hud.classList.remove('hidden');
  $('actionZone').classList.remove('hidden');
  $('joyZone').style.display = 'block';
  S.inGame = true;
  S.isHost = S.isHost; // keep
  S.players = {};
  players.forEach(p => { S.players[p.id] = { ...p, x: 0, y: 0, vx: 0, vy: 0, dashCd: 0 }; });
  S.scores = { red: 0, blue: 0 };
  updateScoreUI();
  requestAnimationFrame(loop);
}

function updateScoreUI() {
  $('redScore').textContent = S.scores.red;
  $('blueScore').textContent = S.scores.blue;
}

let goalTimer = null;
function showGoal(text) {
  const el = $('goalMsg');
  el.textContent = text;
  el.classList.add('show');
  if (goalTimer) clearTimeout(goalTimer);
  goalTimer = setTimeout(() => el.classList.remove('show'), 1500);
}

function showResult(winner, red, blue) {
  $('resultTitle').textContent = winner === 'red' ? '🔴 Победа красных!' : '🔵 Победа синих!';
  $('resultTitle').textContent = 'Матч окончен';
  $('resRed').textContent = red;
  $('resBlue').textContent = blue;
  $('result').classList.add('show');
  S.inGame = false;
}

$('btnRematch').addEventListener('click', () => {
  $('result').classList.remove('show');
  if (S.training) {
    S.training = false;
    startTrainingMode();
  } else {
    socket.emit('rematch');
  }
});
$('btnToMenu').addEventListener('click', () => {
  socket.disconnect();
  setTimeout(() => location.reload(), 200);
});

// ==================== JOYSTICK ====================
let joyActive = false;
let joyId = null;
let joyStart = { x: 0, y: 0 };
const JOY_RADIUS = 75;
const JOY_DEAD = 8;

function joyStartHandler(clientX, clientY, touchId) {
  joyActive = true;
  joyId = touchId;
  joyStart.x = clientX;
  joyStart.y = clientY;
  joyBase.style.display = 'block';
  joyStick.style.display = 'block';
  joyBase.style.left = clientX + 'px';
  joyBase.style.top = clientY + 'px';
  joyStick.style.left = clientX + 'px';
  joyStick.style.top = clientY + 'px';
}

function joyMoveHandler(clientX, clientY) {
  if (!joyActive) return;
  let dx = clientX - joyStart.x;
  let dy = clientY - joyStart.y;
  const len = Math.hypot(dx, dy);
  const maxL = JOY_RADIUS - 15;
  if (len > maxL) { dx = (dx/len)*maxL; dy = (dy/len)*maxL; }
  joyStick.style.left = (joyStart.x + dx) + 'px';
  joyStick.style.top = (joyStart.y + dy) + 'px';
  const dead = JOY_DEAD;
  if (Math.hypot(dx, dy) < dead) {
    S.myInput.x = 0; S.myInput.y = 0;
  } else {
    S.myInput.x = dx / maxL;
    S.myInput.y = dy / maxL;
  }
}

function joyEndHandler() {
  joyActive = false;
  joyId = null;
  joyBase.style.display = 'none';
  joyStick.style.display = 'none';
  S.myInput.x = 0;
  S.myInput.y = 0;
}

joyZone.addEventListener('touchstart', (e) => {
  if (!S.inGame) return;
  e.preventDefault();
  if (joyActive) return;
  const t = e.changedTouches[0];
  joyStartHandler(t.clientX, t.clientY, t.identifier);
}, { passive: false });

joyZone.addEventListener('touchmove', (e) => {
  if (!joyActive) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) joyMoveHandler(t.clientX, t.clientY);
  }
}, { passive: false });

joyZone.addEventListener('touchend', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) joyEndHandler();
  }
}, { passive: false });

joyZone.addEventListener('touchcancel', joyEndHandler, { passive: false });

// Mouse fallback for desktop testing
let mouseJoyActive = false;
joyZone.addEventListener('mousedown', (e) => {
  if (!S.inGame) return;
  mouseJoyActive = true;
  joyStartHandler(e.clientX, e.clientY, 'mouse');
});
addEventListener('mousemove', (e) => {
  if (!mouseJoyActive) return;
  joyMoveHandler(e.clientX, e.clientY);
});
addEventListener('mouseup', () => {
  if (!mouseJoyActive) return;
  mouseJoyActive = false;
  joyEndHandler();
});

// ==================== ACTION BUTTONS ====================
function bindAction(btn, action) {
  function on(e) {
    e.preventDefault();
    btn.classList.add('on');
    if (S.training) {
      doTrainingAction(action);
    } else {
      socket.emit('action', action);
    }
  }
  function off(e) {
    e.preventDefault();
    btn.classList.remove('on');
  }
  btn.addEventListener('touchstart', on, { passive: false });
  btn.addEventListener('touchend', off, { passive: false });
  btn.addEventListener('touchcancel', off, { passive: false });
  btn.addEventListener('mousedown', on);
  btn.addEventListener('mouseup', off);
  btn.addEventListener('mouseleave', off);
}

bindAction(btnKick, 'kick');
bindAction(btnPass, 'pass');
bindAction(btnDash, 'dash');

// ==================== TRAINING MODE ====================
function startTrainingMode() {
  menu.classList.add('hidden');
  lobby.classList.add('hidden');
  hud.classList.remove('hidden');
  $('actionZone').classList.remove('hidden');
  $('joyZone').style.display = 'block';
  S.inGame = true;
  S.training = true;

  // Мой игрок
  S.myId = 'trainer';
  S.players = {};
  S.players['trainer'] = {
    x: -320, y: 0, vx: 0, vy: 0,
    name: S.nick, color: S.color, team: 'red', number: S.number, dashCd: 0
  };
  // Бот-синий
  S.players['bot'] = {
    x: 320, y: 0, vx: 0, vy: 0,
    name: 'Бот', color: '#33aaff', team: 'blue', number: 99, dashCd: 0
  };
  S.ball = { x: 0, y: 0, vx: 0, vy: 0 };
  S.scores = { red: 0, blue: 0 };
  updateScoreUI();

  requestAnimationFrame(trainingLoop);
}

let trainBotTimer = 0;
function trainingLoop(now) {
  if (!S.training) return;
  const dt = Math.min(0.05, (now - S.lastFrame) / 1000);
  S.lastFrame = now;

  const me = S.players['trainer'];
  const bot = S.players['bot'];
  const b = S.ball;

  // --- Bot AI ---
  trainBotTimer -= dt;
  if (trainBotTimer <= 0) {
    trainBotTimer = 0.5;
    // Движемся к мячу или защищаем ворота
    let tx, ty;
    const dist = Math.hypot(b.x - bot.x, b.y - bot.y);
    if (dist < 300) { tx = b.x; ty = b.y; }
    else { tx = 150; ty = b.y * 0.5; }
    const dx = tx - bot.x, dy = ty - bot.y;
    const dl = Math.hypot(dx, dy) || 1;
    bot._ix = dx / dl;
    bot._iy = dy / dl;
  }
  const accel = 950;
  bot.vx += (bot._ix || 0) * accel * dt;
  bot.vy += (bot._iy || 0) * accel * dt;
  const bsp = Math.hypot(bot.vx, bot.vy);
  if (bsp > 380) { bot.vx = bot.vx / bsp * 380; bot.vy = bot.vy / bsp * 380; }
  const fr = Math.pow(0.985, dt * 60);
  bot.vx *= fr; bot.vy *= fr;
  bot.x += bot.vx * dt;
  bot.y += bot.vy * dt;

  // --- Me ---
  me.vx += S.myInput.x * accel * dt;
  me.vy += S.myInput.y * accel * dt;
  const msp = Math.hypot(me.vx, me.vy);
  if (msp > 380) { me.vx = me.vx / msp * 380; me.vy = me.vy / msp * 380; }
  if (Math.hypot(S.myInput.x, S.myInput.y) < 0.01) { me.vx *= fr; me.vy *= fr; }
  me.x += me.vx * dt;
  me.y += me.vy * dt;
  if (me.dashCd > 0) me.dashCd -= dt;
  if (bot.dashCd > 0) bot.dashCd -= dt;

  // --- Ball ---
  const bf = Math.pow(0.99, dt * 60);
  b.vx *= bf; b.vy *= bf;
  b.x += b.vx * dt;
  b.y += b.vy * dt;

  // --- Player-ball collisions ---
  [me, bot].forEach(p => {
    const dx = b.x - p.x, dy = b.y - p.y;
    const d = Math.hypot(dx, dy);
    const minD = p.r || PLAYER_R + BALL_R;
    const md = PLAYER_R + BALL_R;
    if (d < md && d > 0.001) {
      const nx = dx / d, ny = dy / d;
      const ov = md - d;
      b.x += nx * ov; b.y += ny * ov;
      p.x -= nx * ov * 0.3; p.y -= ny * ov * 0.3;
      const pSp = Math.hypot(p.vx, p.vy);
      const kick = Math.max(180, pSp * 1.2);
      b.vx += nx * kick; b.vy += ny * kick;
      const bSp = Math.hypot(b.vx, b.vy);
      if (bSp > 950) { b.vx = b.vx/bSp*950; b.vy = b.vy/bSp*950; }
      S.lastToucher = p === me ? 'trainer' : 'bot';
    }
  });

  // --- Player-player ---
  {
    const a = me, c = bot;
    const dx = c.x - a.x, dy = c.y - a.y;
    const d = Math.hypot(dx, dy);
    const md = PLAYER_R * 2;
    if (d < md && d > 0.001) {
      const nx = dx / d, ny = dy / d;
      const ov = md - d;
      a.x -= nx * ov * 0.5; a.y -= ny * ov * 0.5;
      c.x += nx * ov * 0.5; c.y += ny * ov * 0.5;
    }
  }

  // --- Bounds ---
  [me, bot, b].forEach(o => {
    const r = o === b ? BALL_R : PLAYER_R;
    const dist = Math.hypot(o.x, o.y);
    const maxD = ARENA_R - r;
    if (dist > maxD) {
      const nx = o.x / dist, ny = o.y / dist;
      o.x = nx * maxD; o.y = ny * maxD;
      const vn = o.vx * nx + o.vy * ny;
      if (vn > 0) { o.vx -= 1.72 * vn * nx; o.vy -= 1.72 * vn * ny; }
    }
  });

  // --- Goal ---
  const bd = Math.hypot(b.x, b.y);
  if (bd > ARENA_R + BALL_R) {
    const scorer = S.lastToucher;
    const team = scorer === 'trainer' ? 'red' : 'blue';
    S.scores[team]++;
    updateScoreUI();
    showGoal('ГОЛ!');
    if (S.scores[team] >= MAX_GOALS) {
      showResult(team, S.scores.red, S.scores.blue);
      S.training = false;
      return;
    }
    // reset
    b.x = 0; b.y = 0; b.vx = 0; b.vy = 0;
    me.x = -320; me.y = 0; me.vx = 0; me.vy = 0;
    bot.x = 320; bot.y = 0; bot.vx = 0; bot.vy = 0;
    S.lastToucher = null;
  }

  // --- Render ---
  S.cam.x += (me.x - S.cam.x) * Math.min(1, 6 * dt);
  S.cam.y += (me.y - S.cam.y) * Math.min(1, 6 * dt);
  renderWorld();

  requestAnimationFrame(trainingLoop);
}

function doTrainingAction(action) {
  if (!S.training) return;
  const me = S.players['trainer'];
  const b = S.ball;
  if (action === 'dash') {
    if (me.dashCd > 0) return;
    me.dashCd = 2.0;
    const len = Math.hypot(S.myInput.x, S.myInput.y);
    if (len > 0.1) {
      me.vx += (S.myInput.x / len) * 700;
      me.vy += (S.myInput.y / len) * 700;
    }
  } else {
    const dx = b.x - me.x, dy = b.y - me.y;
    const d = Math.hypot(dx, dy);
    const range = (action === 'kick') ? (PLAYER_R + BALL_R + 30) : (PLAYER_R + BALL_R + 40);
    if (d < range && d > 0.001) {
      const nx = dx / d, ny = dy / d;
      const imp = action === 'kick' ? 620 : 420;
      b.vx += nx * imp; b.vy += ny * imp;
      S.lastToucher = 'trainer';
    }
  }
}

// ==================== NETWORK LOOP ====================
setInterval(() => {
  if (S.inGame && !S.training) socket.emit('input', S.myInput);
}, 50);

// Ping measure
setInterval(() => {
  if (!S.socket || !S.socket.connected || S.training) return;
  const start = Date.now();
  S.socket.emit('ping_measure', null, () => {
    S.ping = Date.now() - start;
    const pb = $('pingBox');
    if (pb) pb.textContent = S.ping + ' ms';
  });
}, 3000);

// ==================== RENDER (multiplayer) ====================
function lerp(a, b, t) { return a + (b - a) * t; }

function renderWorld() {
  // Camera transform
  const camX = S.cam.x || 0;
  const camY = S.cam.y || 0;

  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  const scale = Math.min(W / 1400, H / 1400) * 1.2;
  ctx.scale(scale, scale);
  ctx.translate(W / (2 * scale) - camX, H / (2 * scale) - camY);

  // Grass arena
  ctx.fillStyle = '#1a3d1a';
  ctx.beginPath();
  ctx.arc(0, 0, ARENA_R + 80, 0, Math.PI * 2);
  ctx.fill();

  // Field
  ctx.fillStyle = '#2a6d2a';
  ctx.beginPath();
  ctx.arc(0, 0, ARENA_R, 0, Math.PI * 2);
  ctx.fill();

  // Stripe pattern (stripes on ground)
  ctx.save();
  ctx.beginPath();
  ctx.arc(0, 0, ARENA_R, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  for (let i = -ARENA_R; i < ARENA_R; i += 80) {
    ctx.fillRect(i, -ARENA_R, 40, ARENA_R * 2);
  }
  ctx.restore();

  // Center line
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, -ARENA_R); ctx.lineTo(0, ARENA_R); ctx.stroke();

  // Center circle
  ctx.beginPath();
  ctx.arc(0, 0, 100, 0, Math.PI * 2);
  ctx.stroke();

  // Arena border
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(0, 0, ARENA_R, 0, Math.PI * 2);
  ctx.stroke();

  // Goal markers (left = red goal, right = blue goal)
  ctx.fillStyle = 'rgba(255,51,102,0.3)';
  ctx.beginPath(); ctx.arc(-ARENA_R, 0, 90, -Math.PI/2, Math.PI/2); ctx.fill();
  ctx.fillStyle = 'rgba(51,170,255,0.3)';
  ctx.beginPath(); ctx.arc(ARENA_R, 0, 90, Math.PI/2, -Math.PI/2); ctx.fill();

  // Ball
  drawBall(S.ball.x, S.ball.y);

  // Players
  for (const id in S.players) {
    const p = S.players[id];
    if (p._tx !== undefined) {
      p.x = lerp(p.x, p._tx, 0.4);
      p.y = lerp(p.y, p._ty, 0.4);
    }
    drawPlayer(p, id === S.myId);
  }

  ctx.restore();
}

function drawBall(x, y) {
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.arc(x + 3, y + 3, BALL_R, 0, Math.PI*2); ctx.fill();
  // Ball
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x, y, BALL_R, 0, Math.PI*2); ctx.fill();
  // Pattern
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(x, y, BALL_R * 0.35, 0, Math.PI*2); ctx.fill();
  // Outline
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, BALL_R, 0, Math.PI*2); ctx.stroke();
}

function drawPlayer(p, isMe) {
  const x = p.x || 0, y = p.y || 0;
  const r = PLAYER_R;
  const color = p.color || '#fff';

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath(); ctx.arc(x + 3, y + 3, r, 0, Math.PI*2); ctx.fill();

  // Team ring
  const teamColor = p.team === 'red' ? '#ff3366' : '#33aaff';
  ctx.fillStyle = teamColor;
  ctx.beginPath(); ctx.arc(x, y, r + 4, 0, Math.PI*2); ctx.fill();

  // Body
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();

  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.beginPath(); ctx.arc(x - r*0.3, y - r*0.3, r * 0.5, 0, Math.PI*2); ctx.fill();

  // Number
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle = 'rgba(0,0,0,.8)';
  ctx.lineWidth = 3;
  ctx.strokeText(String(p.number ?? ''), x, y);
  ctx.fillText(String(p.number ?? ''), x, y);

  // Dash cooldown indicator
  if (p.dashCd > 0) {
    ctx.strokeStyle = 'rgba(255,204,0,.9)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(x, y, r + 10, -Math.PI/2, -Math.PI/2 + (1 - p.dashCd / 2) * Math.PI * 2);
    ctx.stroke();
  }

  // Name tag
  ctx.font = 'bold 12px sans-serif';
  ctx.fillStyle = isMe ? '#ffcc00' : '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,.7)';
  ctx.lineWidth = 3;
  ctx.textBaseline = 'bottom';
  ctx.strokeText(p.name || '', x, y - r - 10);
  ctx.fillText(p.name || '', x, y - r - 10);
  ctx.textBaseline = 'middle';
}

// ==================== MAIN LOOP (multiplayer) ====================
function loop(now) {
  const dt = Math.min(0.05, (now - S.lastFrame) / 1000);
  S.lastFrame = now;

  if (S.inGame && !S.training) {
    const me = S.players[S.myId];
    if (me) {
      // Client-side prediction для плавности
      me.vx += S.myInput.x * 950 * dt;
      me.vy += S.myInput.y * 950 * dt;
      const sp = Math.hypot(me.vx, me.vy);
      if (sp > 380) { me.vx = me.vx/sp*380; me.vy = me.vy/sp*380; }
      if (Math.hypot(S.myInput.x, S.myInput.y) < 0.01) {
        const f = Math.pow(0.985, dt * 60);
        me.vx *= f; me.vy *= f;
      }
      me.x += me.vx * dt;
      me.y += me.vy * dt;

      // Camera smoothly follows
      S.cam.x = lerp(S.cam.x, me.x * 0.5, 4 * dt);
      S.cam.y = lerp(S.cam.y, me.y * 0.5, 4 * dt);
    }
  }

  if (S.inGame) {
    renderWorld();
    requestAnimationFrame(loop);
  }
}

})();
